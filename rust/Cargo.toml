[package]
name = "codex-as-api"
version = "0.7.0"
edition = "2021"
description = "Use ChatGPT/Codex OAuth as a local OpenAI-compatible API server."
license = "Apache-2.0"
repository = "https://github.com/Eunho-J/codex-as-api"

[[bin]]
name = "codex-as-api"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
fancy-regex = "0.16"
reqwest = { version = "0.12", features = ["stream", "blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "v5"] }
futures = "0.3"
tower-http = { version = "0.6", features = ["cors"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
