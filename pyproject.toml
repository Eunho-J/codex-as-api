[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "codex-as-api"
version = "0.7.0"
description = "Use ChatGPT/Codex OAuth as a local OpenAI-compatible API server."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Eunho-J", email = "" },
]
keywords = ["openai", "codex", "chatgpt", "oauth", "api", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.100",
    "pydantic>=2.0",
    "regex",
    "tomli>=2; python_version < '3.11'",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "httpx", "types-regex"]

[project.scripts]
codex-as-api = "codex_as_api.server:main"

[project.urls]
Homepage = "https://github.com/Eunho-J/codex-as-api"
Repository = "https://github.com/Eunho-J/codex-as-api"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_as_api"]

[tool.hatch.build.targets.wheel.force-include]
"config/codex-upstream-contract.json" = "codex_as_api/codex-upstream-contract.json"
"config/o200k_base.tiktoken" = "codex_as_api/o200k_base.tiktoken"
"THIRD_PARTY_NOTICES.md" = "codex_as_api/THIRD_PARTY_NOTICES.md"

[tool.hatch.build.targets.sdist]
include = [
    "/config/codex-upstream-contract.json",
    "/config/o200k_base.tiktoken",
    "/src/codex_as_api",
    "/scripts",
    "/rust/THIRD_PARTY_NOTICES.md",
    "/tests",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/README.md",
    "/RELEASES.md",
    "/pyproject.toml",
    "/requirements.txt",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
