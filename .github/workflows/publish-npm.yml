name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match ts/package.json)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish TypeScript package
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    defaults:
      run:
        working-directory: ts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for npmjs
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify version input
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        run: |
          test "$(node -p "require('./package.json').version")" = "${{ inputs.version }}"

      - name: Pack dry run
        run: npm pack --dry-run

      - name: Publish to npmjs
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Skip npmjs publish when NPM_TOKEN is absent
        if: ${{ env.NPM_TOKEN == '' }}
        run: echo "NPM_TOKEN is not configured; npmjs publish skipped."

      - name: Setup Node for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@eunho-j'

      - name: Prepare GitHub Packages package name
        run: npm pkg set name=@eunho-j/codex-as-api repository.url=git+https://github.com/Eunho-J/codex-as-api.git

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --registry=https://npm.pkg.github.com --access public
